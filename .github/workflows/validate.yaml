name: Validation

# Run only when code, test data, or dependencies change
on:
  push:
    branches: [ main ]
    paths: &paths
      - "ppedit/**"
      - "!ppedit/_explore/**"
      - "!ppedit/_review/**"
      - "!ppedit/_validate/**"
      - "!**/*.md"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/validate.yaml"
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # hard stop on a hung download

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # must satisfy requires-python
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install packages
      run: |
        pip install --upgrade pip
        pip install . pytest pytest-cov pylint   # non-editable: catches missing package-data

    - name: Install table data engines (optional Parquet, Feather and Excel formats)
      run: |
        pip install pyarrow openpyxl

    - name: Install cvxopf (optional OPF solvers)
      run: |
        sudo apt-get update
        sudo apt-get install -y coinor-libipopt-dev liblapack-dev libblas-dev gfortran
        pip install git+https://github.com/cvxgrp/cvxopf

    - name: Analyse code
      run: |
        cd ppedit
        pylint --fail-under 0 *.py

    - name: Run tests
      # coverage settings are in pyproject.toml ([tool.coverage.*]); informational only
      run: |
        pytest --durations=10 --cov --cov-report=term --cov-report=xml --cov-report=html

    - name: Coverage summary
      if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
      run: |
        echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        # shields.io endpoint for the README badge (published with the docs)
        total=$(coverage report --format=total --precision=0)
        if [ "$total" -ge 90 ]; then color=brightgreen
        elif [ "$total" -ge 80 ]; then color=green
        elif [ "$total" -ge 70 ]; then color=yellow
        else color=red; fi
        mkdir -p htmlcov
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > htmlcov/badge.json

    - name: Upload coverage report
      if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
        retention-days: 90 # the docs site republishes the latest one from main
