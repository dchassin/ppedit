[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ppedit","ppedit.static"]

[tool.setuptools.package-data]
# list every file pattern the package reads at run time
ppedit = ["*.py"]
"ppedit.static" = ["*.html", "*.css", "*.js"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "ppedit"
version = "0.4.0" 
description = "Browser-based editor for PYPOWER and Arras Energy module pypower models"
authors = [
    {name = "David P. Chassin"},
    ]
maintainers = [
    {name = "David P. Chassin"},
    ]
readme = "README.md"
requires-python = "== 3.12.*" # must match the CI python version
keywords = ["eudoxys","python","pypower","gridlabd","arras-energy","power-flow","editor"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Framework :: Flask",
    ]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/ppedit"
Documentation = "https://www.eudoxys.com/ppedit"
Repository = "https://github.com/eudoxys/ppedit.git"
Issues = "https://github.com/eudoxys/ppedit/issues"

[project.scripts]
ppedit = "ppedit.cli:main"

[tool.pytest.ini_options]
testpaths = ["ppedit/_test"]

# Test coverage (CI runs `pytest --cov`; needs pytest-cov)
[tool.coverage.run]
source_pkgs = ["ppedit"]
omit = ["*/ppedit/_test/*"]
branch = true
relative_files = true

[tool.coverage.paths]
# CI installs non-editable: report site-packages files as the source tree
source = ["ppedit/","*/site-packages/ppedit/"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
